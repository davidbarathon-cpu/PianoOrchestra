name: Construire Piano Orchestra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et tester
    runs-on: ubuntu-latest
    env:
      PO_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (toujours la même, pour les mises à jour)
        env:
          KEYSTORE_B64: ${{ secrets.PO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/po.jks"
            echo "PO_KEYSTORE=$RUNNER_TEMP/po.jks" >> "$GITHUB_ENV"
          else
            # clé du projet (application personnelle) : toujours la même, donc les mises à jour s'installent
            echo "PO_KEYSTORE=$GITHUB_WORKSPACE/signing/piano-orchestra.jks" >> "$GITHUB_ENV"
            echo "PO_KEYSTORE_PASSWORD=PianoBermet2026" >> "$GITHUB_ENV"
          fi

      - name: Tests du moteur (sons, morceaux, rendu audio)
        run: ./gradlew --no-daemon testReleaseUnitTest 2>&1 | tee test.log || true

      - name: Résultat des tests
        run: |
          grep -q "BUILD SUCCESSFUL" test.log || { tail -200 test.log; exit 1; }

      - name: Compiler l'APK
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PianoOrchestra-0.1.${PO_BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendu-audio
          path: |
            app/build/test-wav/*.wav
            test.log

  screenshots:
    name: Essai sur tablette virtuelle et captures
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tablette virtuelle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash tools/screenshots.sh out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: shots/

  release:
    name: Publier la mise à jour
    needs: [build, screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Piano Orchestra 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
